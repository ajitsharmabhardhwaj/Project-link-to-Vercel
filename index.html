
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Figma</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f5f5;
      color: #1e1e1e;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 420px);
      padding: 40px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgb(0 0 0 / 6%);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 32px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .figma-mark {
      display: grid;
      grid-template-columns: repeat(2, 10px);
      grid-template-rows: repeat(3, 10px);
      width: 20px;
      height: 30px;
    }

    .figma-mark span:nth-child(1) { background: #f24e1e; border-radius: 6px 0 0 6px; }
    .figma-mark span:nth-child(2) { background: #ff7262; border-radius: 0 6px 6px 0; }
    .figma-mark span:nth-child(3) { background: #a259ff; border-radius: 6px 0 0 6px; }
    .figma-mark span:nth-child(4) { background: #1abcfe; border-radius: 50%; }
    .figma-mark span:nth-child(5) { background: #0acf83; border-radius: 6px 0 6px 6px; }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #707070;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      outline: none;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #7b61ff;
      box-shadow: 0 0 0 3px rgb(123 97 255 / 13%);
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 68px; }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 5px;
      border: 0;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 12px;
    }

    .forgot {
      display: block;
      margin: 12px 0 22px;
      color: #5b45e0;
      text-align: right;
      text-decoration: none;
      font-size: 13px;
    }

    button.submit, .google-button {
      width: 100%;
      height: 46px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
    }

    button.submit {
      border: 0;
      background: #1e1e1e;
      color: #fff;
    }

    button.submit:hover { background: #383838; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: #888;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      height: 1px;
      flex: 1;
      background: #e7e7e7;
      content: "";
    }

    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #d8d8d8;
      background: #fff;
      color: #222;
    }

    .google-button:hover { background: #fafafa; }

    .signup {
      margin: 26px 0 0;
      color: #707070;
      text-align: center;
      font-size: 13px;
    }

    .signup a {
      color: #5b45e0;
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-label="Figma">
      <span class="figma-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </span>
      Figma
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your Figma account</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button class="toggle-password" type="button" id="toggle-password">Show</button>
      </div>

      <a class="forgot" href="feature.html">Forgot password?</a>
      <button class="submit" type="submit">Log in</button>
    </form>

    <div class="divider">or</div>

    <button class="google-button" type="button">
      <span aria-hidden="true">G</span> Continue with Google
    </button>

    <p class="signup">Don't have an account? <a href="#">Create one</a></p>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle-password");

    toggle.addEventListener("click", () => {
      const isHidden = password.type === "password";
      password.type = isHidden ? "text" : "password";
      toggle.textContent = isHidden ? "Hide" : "Show";
    });

    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      alert("Login form submitted. Connect it to your authentication service.");
    });
  </script>
</body>
</html>
